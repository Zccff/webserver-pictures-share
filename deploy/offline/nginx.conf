limit_conn_zone $binary_remote_addr zone=upload_ip_connections:10m;
limit_conn_zone $cookie_sid zone=upload_session_connections:10m;
limit_req_zone $binary_remote_addr zone=upload_ip_rate:10m rate=30r/m;

upstream mywebserver_app {
    server app:9006;
    keepalive 256;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    access_log off;
    limit_conn_status 429;
    limit_req_status 429;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    root /usr/share/nginx/mywebserver;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /404.html {
        try_files /404.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Authenticate with a bodyless subrequest before Nginx starts streaming
    # upload bytes to the C++ service. The app network is internal-only, while
    # the public edge also bounds upload concurrency and request rate.
    location = /_upload_auth {
        internal;
        proxy_pass http://mywebserver_app/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
    }

    # Stream upload bytes to the C++ reactor instead of buffering the whole
    # request in Nginx memory or a temporary proxy file.
    location = /api/upload-image {
        # The backend accepts exactly one fixed-length body.
        # Reject chunked framing before any upload bytes are proxied.
        if ($http_transfer_encoding != "") { return 411; }
        auth_request /_upload_auth;
        limit_conn upload_ip_connections 4;
        limit_conn upload_session_connections 2;
        limit_req zone=upload_ip_rate burst=10 nodelay;
        proxy_pass http://mywebserver_app;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Content-Length $http_content_length;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        proxy_pass http://mywebserver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
    }

    location /images/ {
        proxy_pass http://mywebserver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "private, no-store";
    }

    location /thumbnails/ {
        proxy_pass http://mywebserver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
    }

    location /protected-thumbnails/ {
        internal;
        alias /usr/share/nginx/protected-images/thumbnails/;
        add_header Cache-Control "private, max-age=300";
    }

    location /protected-images/ {
        internal;
        alias /usr/share/nginx/protected-images/;
        add_header Cache-Control "private, no-store";
    }

    location / {
        proxy_pass http://mywebserver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
    }
}
