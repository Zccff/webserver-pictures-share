services:
  mysql:
    image: mysql:8.4
    container_name: ${MYSQL_CONTAINER_NAME:-mywebserver-v5-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_web_server}
      MYSQL_USER: ${MYSQL_USER:-webuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-mywebserver-v5-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - backend

  app:
    image: mywebserver-app:opt-v5
    container_name: ${APP_CONTAINER_NAME:-mywebserver-v5-app}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-webuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_web_server}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-8}
      MYSQL_POOL_WAIT_TIMEOUT_MS: ${MYSQL_POOL_WAIT_TIMEOUT_MS:-100}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-myweb:v5:}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-8}
      REDIS_IO_TIMEOUT_MS: ${REDIS_IO_TIMEOUT_MS:-3000}
      REDIS_COMMAND_CAPACITY: ${REDIS_COMMAND_CAPACITY:-4096}
      REDIS_MAX_PIPELINE_PER_CONNECTION: ${REDIS_MAX_PIPELINE_PER_CONNECTION:-256}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_CACHE_TTL_SECONDS: ${SESSION_CACHE_TTL_SECONDS:-3}
      SESSION_CACHE_CAPACITY: ${SESSION_CACHE_CAPACITY:-20000}
      LOGIN_CACHE_TTL_SECONDS: ${LOGIN_CACHE_TTL_SECONDS:-3}
      LOGIN_CACHE_CAPACITY: ${LOGIN_CACHE_CAPACITY:-10000}
      WORKER_QUEUE_CAPACITY: ${WORKER_QUEUE_CAPACITY:-4096}
      LOG_QUEUE_CAPACITY: ${LOG_QUEUE_CAPACITY:-8192}
      COMPLETION_QUEUE_CAPACITY: ${COMPLETION_QUEUE_CAPACITY:-4096}
      PENDING_CONNECTION_QUEUE_CAPACITY: ${PENDING_CONNECTION_QUEUE_CAPACITY:-1024}
      MAX_CONNECTIONS_PER_SUB_REACTOR: ${MAX_CONNECTIONS_PER_SUB_REACTOR:-4096}
      LISTEN_BACKLOG: ${LISTEN_BACKLOG:-1024}
      CONNECTION_IDLE_TIMEOUT_MS: ${CONNECTION_IDLE_TIMEOUT_MS:-60000}
      BUSINESS_TIMEOUT_MS: ${BUSINESS_TIMEOUT_MS:-15000}
      MAX_IMAGES_PER_USER: ${MAX_IMAGES_PER_USER:-100}
      MAX_CONCURRENT_UPLOADS_PER_USER: ${MAX_CONCURRENT_UPLOADS_PER_USER:-2}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-20}
      UPLOAD_PERMIT_TTL_SECONDS: ${UPLOAD_PERMIT_TTL_SECONDS:-30}
      UPLOAD_IDEMPOTENCY_TTL_SECONDS: ${UPLOAD_IDEMPOTENCY_TTL_SECONDS:-86400}
      IMAGE_LIFECYCLE_PENDING_TTL_SECONDS: ${IMAGE_LIFECYCLE_PENDING_TTL_SECONDS:-120}
      IMAGE_LIST_CACHE_TTL_SECONDS: ${IMAGE_LIST_CACHE_TTL_SECONDS:-3}
      IMAGE_STATUS_CACHE_TTL_SECONDS: ${IMAGE_STATUS_CACHE_TTL_SECONDS:-30}
      IMAGE_PROCESSOR_THREADS: ${IMAGE_PROCESSOR_THREADS:-2}
      IMAGE_PROCESSOR_QUEUE_CAPACITY: ${IMAGE_PROCESSOR_QUEUE_CAPACITY:-256}
      IMAGE_PROCESSOR_TIMEOUT_SECONDS: ${IMAGE_PROCESSOR_TIMEOUT_SECONDS:-15}
      THUMBNAIL_MAX_WIDTH: ${THUMBNAIL_MAX_WIDTH:-480}
      THUMBNAIL_MAX_HEIGHT: ${THUMBNAIL_MAX_HEIGHT:-480}
      THUMBNAIL_WEBP_QUALITY: ${THUMBNAIL_WEBP_QUALITY:-82}
      X_ACCEL_REDIRECT: "1"
      MYWEBSERVER_LOG_LEVEL: ${MYWEBSERVER_LOG_LEVEL:-WARN}
    volumes:
      - image_data:/app/webroot/images
    expose:
      - "9006"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME:-mywebserver-v5-nginx}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot:/usr/share/nginx/mywebserver:ro
      - image_data:/usr/share/nginx/protected-images:ro
    networks:
      - frontend
      - backend

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-mywebserver-v5_mysql_data}
    external: ${MYSQL_VOLUME_EXTERNAL:-false}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-mywebserver-v5_redis_data}
    external: ${REDIS_VOLUME_EXTERNAL:-false}
  image_data:
    name: ${IMAGE_VOLUME_NAME:-mywebserver-v5_image_data}
    external: ${IMAGE_VOLUME_EXTERNAL:-false}

networks:
  frontend:
  backend:
    internal: true
