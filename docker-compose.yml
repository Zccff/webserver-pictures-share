services:
  mysql:
    image: mysql:8.4
    container_name: mywebserver-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: my_web_server
      MYSQL_USER: webuser
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mywebserver-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: mywebserver-app:opt-v5
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com/ubuntu}
    container_name: mywebserver-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: webuser
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: my_web_server
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: "myweb:v5:"
      SESSION_TTL_SECONDS: 86400
      SESSION_CACHE_TTL_SECONDS: 3
      LOGIN_CACHE_TTL_SECONDS: 3
      REDIS_POOL_SIZE: 8
      MYSQL_POOL_SIZE: 8
      MYSQL_POOL_WAIT_TIMEOUT_MS: 100
      REDIS_IO_TIMEOUT_MS: 3000
      REDIS_COMMAND_CAPACITY: 4096
      REDIS_MAX_PIPELINE_PER_CONNECTION: 256
      WORKER_QUEUE_CAPACITY: 4096
      LOG_QUEUE_CAPACITY: 8192
      COMPLETION_QUEUE_CAPACITY: 4096
      PENDING_CONNECTION_QUEUE_CAPACITY: 1024
      MAX_CONNECTIONS_PER_SUB_REACTOR: 4096
      LISTEN_BACKLOG: 1024
      CONNECTION_IDLE_TIMEOUT_MS: 60000
      BUSINESS_TIMEOUT_MS: 15000
      SESSION_CACHE_CAPACITY: 20000
      LOGIN_CACHE_CAPACITY: 10000
      MAX_IMAGES_PER_USER: 100
      MAX_CONCURRENT_UPLOADS_PER_USER: 2
      UPLOAD_RATE_LIMIT_PER_MINUTE: 20
      UPLOAD_PERMIT_TTL_SECONDS: 30
      UPLOAD_IDEMPOTENCY_TTL_SECONDS: 86400
      IMAGE_LIFECYCLE_PENDING_TTL_SECONDS: 120
      X_ACCEL_REDIRECT: 1
      MYWEBSERVER_LOG_LEVEL: WARN
      IMAGE_LIST_CACHE_TTL_SECONDS: 3
      IMAGE_STATUS_CACHE_TTL_SECONDS: 30
      IMAGE_PROCESSOR_THREADS: 2
      IMAGE_PROCESSOR_QUEUE_CAPACITY: 256
      IMAGE_PROCESSOR_TIMEOUT_SECONDS: 15
      THUMBNAIL_MAX_WIDTH: 480
      THUMBNAIL_MAX_HEIGHT: 480
      THUMBNAIL_WEBP_QUALITY: 82
    volumes:
      - image_data:/app/webroot/images
    expose:
      - "9006"

  nginx:
    image: nginx:1.27-alpine
    container_name: mywebserver-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot:/usr/share/nginx/mywebserver:ro
      - image_data:/usr/share/nginx/protected-images:ro

volumes:
  mysql_data:
  redis_data:
  image_data:
